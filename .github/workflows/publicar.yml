# Publica el sitio en Cloudflare Pages desde GitHub.
#
# Existe porque la subida desde el Mac va a ~34 KB/s: el banner de 20 MB solo
# tardaba diez minutos y el sitio entero casi veinte, y la subida se cortaba a
# mitad. Aquí el clon y la subida ocurren dentro de la red de GitHub, así que
# da igual cómo esté la conexión de casa.
#
# Qué sube: lo que arma `publicar.sh`, que es una lista de lo que SÍ se
# publica. Este repo es PÚBLICO y guarda documentos internos y los originales
# pesados; nada de eso entra en `dist/`.
name: Publicar el sitio

on:
  push:
    branches: [master]
  workflow_dispatch: # para publicar a mano desde la pestaña Actions

# Si llegan dos commits seguidos, que no se pisen las subidas.
concurrency:
  group: publicar-sitio
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Armar dist/
        run: bash publicar.sh

      # Sin la acción de Cloudflare: así el token se limpia de espacios y
      # saltos de línea invisibles (un secreto pegado con un \n de más da
      # «Authentication failed 9106», que no dice nada de eso) y se ve el
      # código HTTP de una comprobación antes de intentar subir.
      - name: Subir a Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          codigo=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/skydancer-sitio" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "largo del secreto guardado: ${#CLOUDFLARE_API_TOKEN} caracteres (debe ser 53)"
          echo "comprobación del token contra el proyecto: HTTP $codigo"
          [ "$codigo" = "200" ] || { echo "El token guardado en el repo no sirve para este proyecto."; exit 1; }
          npx --yes wrangler@4.151.3 pages deploy dist --project-name=skydancer-sitio --branch=master
